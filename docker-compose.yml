services:
  # Production: docker compose up -d --build
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ixxmmivsdrgn-portfolio:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Point to the mongo service inside the compose network
      DATABASE_URL: mongodb://mongo:27017/ixxmmivsdrgn-portfolio
    volumes:
      - media:/app/public/media
    depends_on:
      mongo:
        condition: service_healthy

  # Development with hot reload: docker compose --profile dev up dev mongo
  dev:
    profiles: ['dev']
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/ixxmmivsdrgn-portfolio
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    command: ['--storageEngine=wiredTiger']
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  media:
  dev_node_modules:
  dev_next:
